name: base-rates

on:
  # 과거 약 3년치 일봉으로 기본 확률표(data/base_rates.json)를 만듦. Actions 탭에서 수동 실행(또는 cron-job.org 주 1회 호출)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests cryptography

      # 한투 접근 토큰 재사용용 캐시 (암호화된 파일, 저장소에는 커밋 안 됨)
      - uses: actions/cache@v4
        with:
          path: .kis_token.enc
          key: kis-token-${{ github.run_id }}
          restore-keys: |
            kis-token-

      - name: Build base rates
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python baserates.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data
          git diff --cached --quiet || git commit -m "base rates: $(TZ=Asia/Seoul date +%F_%H%M)"
          git push
