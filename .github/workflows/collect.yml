name: market-data

on:
  # 예약 실행은 GitHub 내장 cron 대신 cron-job.org가 아래 workflow_dispatch를 호출함
  # (GitHub 내장 cron은 몇 시간씩 늦거나 빠져서, 늦게 돈 아침 수집이 장중 데이터로 덮어쓰는 문제가 있었음)
  #   평일 06:30 KST → session=morning / 평일 16:20 KST → session=evening
  workflow_dispatch:           # cron-job.org 호출 + Actions 탭 수동 실행용
    inputs:
      session:
        description: "morning 또는 evening (비우면 한국시간 기준 자동)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests cryptography

      # 한투 접근 토큰 재사용용 캐시 (암호화된 파일, 저장소에는 커밋 안 됨)
      - uses: actions/cache@v4
        with:
          path: .kis_token.enc
          key: kis-token-${{ github.run_id }}
          restore-keys: |
            kis-token-

      - name: Collect market data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          S="${{ github.event.inputs.session }}"
          if [ -z "$S" ]; then
            H=$(TZ=Asia/Seoul date +%H)
            if [ "$H" -lt 12 ]; then S=morning; else S=evening; fi
          fi
          python collect.py "$S"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F_%H%M)"
          git push
